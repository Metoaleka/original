<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="መቶ አለቃ - የሚገኙ ምርቶች">

    <title>የሚገኙ ምርቶች - መቶ አለቃ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
            font-weight: bold;
        }

        header {
            background: #111;
            border: 2px solid #fff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 2rem;
            margin: 20px 0;
        }

        header p {
            font-size: 1.1rem;
            line-height: 1.7;
        }

        /* PRODUCT GRID */
        .products {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        /* PRODUCT CARD */
        .product-card {
            background: #111;
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 15px;
            overflow: hidden;
        }

        /* PRODUCT IMAGE */
        .product-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #000;
            border: 2px solid #fff;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* PRODUCT NAME */
        .product-name {
            font-size: 1.3rem;
            margin-bottom: 12px;
        }

        /* STOCK STATUS */
        .stock {
            display: inline-block;
            padding: 8px 15px;
            border: 2px solid #fff;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .in-stock {
            background: #fff;
            color: #000;
        }

        .out-stock {
            background: #000;
            color: #fff;
        }

        .quantity {
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* BACK BUTTON */
        .btn {
            display: inline-block;
            margin-top: 30px;
            background: #fff;
            color: #000;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 900;
            border: 2px solid #fff;
            transition: 0.3s;
        }

        .btn:hover {
            background: #000;
            color: #fff;
        }

        footer {
            background: #111;
            border: 2px solid #fff;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
        }

        /* TABLET */
        @media (max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
                width: 95%;
            }
        }

        /* PHONE */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.8rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            .products {
                grid-template-columns: 1fr;
                width: 95%;
            }

            .product-card img {
                height: 200px;
            }
        }
    </style>
</head>

<body>

            </div>
